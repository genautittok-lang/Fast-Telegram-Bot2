        {
          "@type": "Question",
          "name": "What is DARKSHARE?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DARKSHARE is an AI-powered OSINT and threat-intelligence platform. It scans IP addresses, crypto wallets, emails, domains, URLs, CVEs, EXIF metadata and GEOINT, scores risk with AI, monitors targets in real time and exports branded PDF reports — available via web, Telegram bot @DarkShare1Bot and REST API."

        },
        {
          "@type": "Question",
          "name": "Is DARKSHARE free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. DARKSHARE has a free tier with daily OSINT scans. Paid tiers (PRO $9, ENTERPRISE $30, GROUPS $45) unlock unlimited scans, real-time monitoring, AI threat profiles, branded PDF reports and full API access."
          }
        },
        {
          "@type": "Question",
          "name": "How does DARKSHARE handle GDPR data deletion?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DARKSHARE complies with GDPR Art. 17, UK DPA 2018 and Ukrainian Law on Personal Data Protection. The /data-deletion endpoint automatically erases the requested identifier from our index, cache, monitors, favorites, AI profiles and chat messages immediately on submission. Backup copies are purged within 90 days."
          }
        },
        {
          "@type": "Question",
          "name": "Does DARKSHARE store the data I search?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Search inputs are processed in-memory; reports you choose to save are stored under your account and can be deleted at any time from the History page or via the GDPR data-deletion form."
          }
        },
        {
          "@type": "Question",
          "name": "Which OSINT modules does DARKSHARE support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "17+ modules: IP/ASN reputation, DNS, WHOIS, crypto wallets (BTC/ETH/TRX), email leak checks, domain analysis, URL/SSL safety, CVE lookup, EXIF metadata, GEOINT location hints, dark-web monitoring, AI risk scoring, takedown letter generator, compromise wizard and threat-profile builder."
          }
        },
        {
          "@type": "Question",
          "name": "How do I log in to DARKSHARE?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DARKSHARE uses Telegram Login Widget — sign in with one tap via @DarkShare1Bot. No passwords are stored on our side."
          }
        }
